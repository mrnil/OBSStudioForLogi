name: Markdown Lint
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - '**/*.md'

jobs:
  rumdl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run rumdl
        # Pin both the action and the rumdl binary: the action installs the latest rumdl by
        # default, and a new release can add rules that fail CI on files nobody changed
        uses: rvben/rumdl@v0.3.5
        with:
          version: 0.3.5
          command: check
          path: .
          fail-on-error: true
