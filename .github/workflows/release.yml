name: Release
permissions:
  contents: read

on:
  push:
    tags: ['v*']

jobs:
  # Gate: only release a commit that is on main and that every other workflow
  # (Build and Test, Dependency Check & Build, CodeQL, Markdown Lint, ...) passed on.
  # Those workflows run on the push to main, not on the tag, so wait for any still running.
  ci-passed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read    # read the check runs on the tagged commit
      actions: read   # find this workflow's own runs, to leave them out
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      # Checks that must be present: a commit without them was never built by CI
      REQUIRED: '["test-and-package", "build", "Analyze (csharp)"]'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tagged commit is on main
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          SHA=$(git rev-parse "$TAG^{commit}")
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG points at $SHA, which isn't on main. Push the commit to main and let CI pass before tagging."
            exit 1
          fi

      - name: Every check on the tagged commit passed
        shell: bash   # explicit shell adds -o pipefail, so a failed gh call stops the step instead of polling on
        run: |
          # Leave out this workflow's runs (this one and any earlier release attempts for the same commit)
          own=$(gh api "repos/$REPO/actions/workflows/release.yml/runs?head_sha=$SHA&per_page=100" --jq '[.workflow_runs[].check_suite_id]')

          deadline=$((SECONDS + 1800))
          idle=0
          while :; do
            runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[]' \
              | jq -s --argjson own "$own" '[.[] | select(.check_suite.id | IN($own[]) | not) | {name, status, conclusion}]')
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            missing=$(jq -r --argjson req "$REQUIRED" '$req - [.[].name] | join(", ")' <<<"$runs")

            if [ "$pending" -eq 0 ] && [ -z "$missing" ]; then break; fi

            # Nothing running and a required check absent: CI never ran on this commit
            # (for example it was not the last commit of a push). Allow ~90s for runs to register.
            if [ "$pending" -eq 0 ]; then idle=$((idle + 1)); else idle=0; fi
            if [ "$idle" -ge 3 ]; then
              echo "::error::No $missing check on $SHA. CI only runs on the last commit of a push to main; tag a commit CI has run on."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for checks on $SHA ($pending still running; missing: ${missing:-none})"
              exit 1
            fi

            echo "Waiting: $pending check(s) running${missing:+, not started yet: $missing}"
            sleep 30
          done

          jq -r '.[] | "\(.name): \(.conclusion)"' <<<"$runs"
          failed=$(jq -r '[.[] | select(.conclusion | IN("success", "skipped", "neutral") | not) | "\(.name) (\(.conclusion))"] | join(", ")' <<<"$runs")
          if [ -n "$failed" ]; then
            echo "::error::Checks on $SHA did not pass: $failed. Fix them on main, then move the tag."
            exit 1
          fi

  release:
    needs: ci-passed
    runs-on: windows-latest
    permissions:
      contents: write   # create the GitHub release and upload the package
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      # Fail before building if anything docs/ai/release-process.md asks for is missing
      - name: Check versions, changelog and release notes
        run: |
          $v = $env:TAG.Substring(1)

          $csproj = (Select-String -Path src/OBSStudioForLogiPlugin.csproj -Pattern '<Version>(.+)</Version>').Matches[0].Groups[1].Value
          $yaml = (Select-String -Path src/package/metadata/LoupedeckPackage.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value.Trim('"', "'")
          if ($csproj -ne $v -or $yaml -ne $v) { throw "Tag $v doesn't match the csproj ($csproj) and LoupedeckPackage.yaml ($yaml)" }

          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## [$v]" -Quiet)) { throw "CHANGELOG.md has no ## [$v] entry" }
          $notes = "RELEASE_NOTES_v$v.md"
          if (-not (Test-Path $notes)) { throw "$notes is missing" }

          # The notes' first line is the release title: "# vX.Y.Z - Title"
          $lines = @(Get-Content $notes -Encoding utf8)
          if ($lines[0] -notmatch "^#\s+($([regex]::Escape($env:TAG))\s+-\s+(.+?))\s*$") {
            throw "The first line of $notes should be '# $env:TAG - Title', not '$($lines[0])'"
          }
          $title = $Matches[1]
          if ($Matches[2] -match '[{}]') { throw "The title in $notes still has a placeholder: '$title'" }

          # Release body is the notes without that heading (GitHub shows the title above the body)
          $body = $lines | Select-Object -Skip 1 | Out-String
          Set-Content -Path "${{ runner.temp }}/release-body.md" -Value $body.TrimStart() -Encoding utf8

          "VERSION=$v" >> $env:GITHUB_ENV
          "TITLE=$title" >> $env:GITHUB_ENV

      # .NET 10 builds the plugin; LogiPluginTool is a .NET 8 tool
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build and test (Release)
        run: |
          New-Item -ItemType Directory -Force "${{ runner.temp }}/pluginlink" | Out-Null
          dotnet test tests/OBSStudioForLogiPlugin.Tests/OBSStudioForLogiPlugin.Tests.csproj -c Release -p:PluginDir=${{ runner.temp }}/pluginlink/

      - name: Package, verify and show metadata
        run: |
          dotnet tool install -g LogiPluginTool
          logiplugintool pack bin\Release "OBSStudioForLogiPlugin-v$env:VERSION.lplug4"
          logiplugintool verify "OBSStudioForLogiPlugin-v$env:VERSION.lplug4"
          logiplugintool metadata "OBSStudioForLogiPlugin-v$env:VERSION.lplug4"

      # Published straight away: the ci-passed gate and the checks above have already run.
      # A version with a suffix (v2.2.0-beta.1) is a pre-release and doesn't become Latest.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $flags = if ($env:VERSION.Contains('-')) { @('--prerelease', '--latest=false') } else { @('--latest') }
          gh release create $env:TAG "OBSStudioForLogiPlugin-v$env:VERSION.lplug4" `
            --verify-tag @flags `
            --title $env:TITLE `
            --notes-file "${{ runner.temp }}/release-body.md"
