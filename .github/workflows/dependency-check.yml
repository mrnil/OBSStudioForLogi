name: Dependency Check & Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Setup PluginApi.dll for CI
        run: |
          mkdir -p "C:\Program Files\Logi\LogiPluginService"
          copy "ci\PluginApi.dll" "C:\Program Files\Logi\LogiPluginService\PluginApi.dll"
        shell: cmd

      - name: Restore
        run: dotnet restore OBSStudioForLogiPlugin.sln

      - name: Build
        run: dotnet build OBSStudioForLogiPlugin.sln --no-restore --configuration Release

  auto-merge-dependabot:
    needs: build
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch updates only
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}