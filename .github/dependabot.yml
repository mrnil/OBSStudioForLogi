version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "mrnil"
    labels:
      - "dependencies"

  - package-ecosystem: "nuget"
    directory: "/tests/OBSStudioForLogiPlugin.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "mrnil"
    labels:
      - "dependencies"
      - "tests"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"