version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "mrnil"
    labels:
      - "dependencies"

  - package-ecosystem: "nuget"
    directory: "/tests/OBSStudioForLogiPlugin.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "mrnil"
    labels:
      - "dependencies"
      - "tests"

  # .NET tools in .config/dotnet-tools.json (LogiPluginTool, used by build.yml and release.yml).
  # "/" also holds the .sln, so allow only the tool: the projects are covered by the entries above
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    allow:
      - dependency-name: "LogiPluginTool"
    reviewers:
      - "mrnil"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"